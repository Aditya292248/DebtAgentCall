[project]
name = "debt-agent-call"
version = "0.1.0"
description = "A compliance-first debt-collection voice agent, built one part at a time."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Aditya Bisht" }]
keywords = ["voice-agent", "debt-collection", "compliance", "fastapi", "agentphone"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Framework :: FastAPI",
    "Topic :: Communications :: Telephony",
]
requires-python = ">=3.11"
dependencies = [
    "agentphone>=0.20.5",
    "fastapi>=0.162.0",
    "httpx>=0.27",
    "psycopg[binary]>=3.3.7",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.3",
    "tzdata>=2026.6",
    "uvicorn>=0.54.0",
]

[project.urls]
Repository = "https://github.com/Aditya292248/DebtAgentCall"
Issues = "https://github.com/Aditya292248/DebtAgentCall/issues"

[project.scripts]
verify = "tasks.verify:main"
accept = "tasks.accept:main"
demo = "tasks.demo:main"
seed-demo = "tasks.seed_demo:main"
audit-verify = "tasks.audit_verify:main"
serve = "tasks.serve:main"
latency-report = "tasks.latency_report:main"
api = "harness.api:main"
dialer = "dialer.cli:main"
reconcile = "dialer.reconcile:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["model", "harness", "compliance", "phone", "sim", "tasks", "dialer"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# starlette's notice about its TestClient using httpx; nothing for us to change.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
markers = ["db: needs the local Supabase database (`supabase start`); skipped without it"]
