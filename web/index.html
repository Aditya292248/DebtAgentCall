<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DebtAgentCall</title>
    <script>
      // Light is the default. Apply a saved dark theme before the first paint,
      // so it doesn't flash light.
      try {
        if (localStorage.getItem('debtagentcall-theme') === 'dark') {
          document.documentElement.classList.add('dark')
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
