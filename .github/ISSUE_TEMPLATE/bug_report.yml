name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Use made-up data only. Never paste real names, phone numbers, account numbers or secrets.
        For a security problem, do not file an issue; see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The commands or steps, starting from a fresh `uv sync`.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Operating system and tool versions
      description: For example Windows 11, Python 3.12, uv, Node.js.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed any real personal data and secrets from this report.
          required: true
